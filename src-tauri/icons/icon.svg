<!-- ローカルHTMLエディタのアイコン(G2: 紺の背景に、オレンジの括弧で挟んだ白いページ).
     各OS向けのアイコンは、1024px のPNGに書き出してから作り直す
     (rsvg-convert -w 1024 -h 1024 src-tauri/icons/icon.svg -o icon.png && npx tauri icon icon.png -o src-tauri/icons).
     macOS の作法に合わせ、1024px の中に 824px の角丸の板を置き、周りを透明の余白にしている -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
